[package]
name = "russh"
version = "0.1.0"
description = "AI-native SSH client"
authors = ["xiaojia"]
edition = "2021"

[lib]
name = "russh_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.40", features = ["vendored-openssl"] }
russh-keys = "0.40"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
whoami = "1"
rig = { version = "0.37", features = ["reqwest"] }
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
